<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solo AI – Reset Password</title>
    <link rel="icon" type="image/x-icon" href="assets/images/logo/favicon.ico" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* Use same base styles as sign-in page, but simplified for single form */
        body { background:#F8FAFC; font-family:'Inter', sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
        .reset-card { background:#FFFFFF; border-radius:16px; box-shadow:0 8px 48px rgba(0,0,0,0.06); padding:40px; max-width:400px; width:100%; }
        .reset-card h1 { font-size:24px; font-weight:700; color:#0F172A; margin-bottom:8px; }
        .reset-card p { font-size:14px; color:#94A3B8; margin-bottom:24px; }
        .form-group { margin-bottom:18px; }
        .form-group label { font-size:13px; font-weight:500; color:#0F172A; display:block; margin-bottom:4px; }
        .form-group input { width:100%; height:46px; padding:0 14px; border:1px solid #E5E7EB; border-radius:12px; font-size:15px; outline:none; }
        .form-group input:focus { border-color:#2563EB; box-shadow:0 0 0 3px rgba(37,99,235,0.10); }
        .btn-submit { width:100%; height:52px; background:#2563EB; color:white; border:none; border-radius:14px; font-size:16px; font-weight:600; cursor:pointer; }
        .btn-submit:hover { background:#1D4ED8; }
        .back-link { text-align:center; margin-top:16px; font-size:14px; color:#475569; }
        .back-link a { color:#2563EB; text-decoration:none; font-weight:600; }
    </style>
</head>
<body>
    <div class="reset-card">
        <h1>Reset Password</h1>
        <p>Enter your email and choose a new password.</p>
        <form id="resetForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="resetEmail" required />
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" required />
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" required />
            </div>
            <button type="submit" class="btn-submit">Update Password</button>
        </form>
        <div class="back-link">Remembered password? <a href="sign-in.html">Sign In</a></div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value.trim();
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            if (newPass !== confirmPass) {
                alert('Passwords do not match.');
                return;
            }
            let users = JSON.parse(localStorage.getItem('users') || '[]');
            const idx = users.findIndex(u => u.email === email);
            if (idx === -1) {
                alert('No account found with that email.');
                return;
            }
            users[idx].password = newPass;
            localStorage.setItem('users', JSON.stringify(users));
            alert('Password updated! Please sign in.');
            window.location.href = 'sign-in.html';
        });
    </script>
</body>
</html>
